// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven { url = uri("https://esri.jfrog.io/artifactory/arcgis") }
        maven { url = uri("https://jcenter.bintray.com") }

    }
    ext {
        kotlinVersion = "2.1.0"
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"


        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        configurations {
            all*.exclude module: "support-core-ui"
        }
    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.google.com' }
        maven { url = uri("https://esri.jfrog.io/artifactory/arcgis") }
        maven { url = uri("https://jcenter.bintray.com") }

        flatDir {
            dirs("libs")
        }
    }

    // The project lives inside a OneDrive-synced folder; its background scanner
    // randomly locks freshly-written build intermediates and breaks release
    // packaging. Redirect all build output to a local, non-synced path.
    buildDir = new File("C:/gradle_build/anynews/${project.name}")

}

task clean(type: Delete) {
    delete rootProject.buildDir
}
