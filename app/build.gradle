    defaultConfig {
        applicationId "com.anyNews.anynews"
        minSdkVersion 24
        targetSdk 35
        multiDexEnabled true
        versionCode 330
        versionName "3.42.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        renderscriptTargetApi 33
        renderscriptSupportModeEnabled true
        archivesBaseName = "AnyNews_"+versionName+"_"
        ndkVersion "27.0.12077973"
        ndk {
            // Specify the ABI filters for the native libraries you are using
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

    }
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.forkOptions.jvmArgs += [
                '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
                '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED']
    }
    bundle {
        // Configure the app bundle options
        abi {
            // Enable split APKs for ABI configurations
            enableSplit = true
        }
        density {
            // Enable split APKs for screen density configurations
            enableSplit = true
        }
        language {
            // Enable split APKs for language configurations
            enableSplit = true
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFiles 'proguard-rules.pro'
        }
        release {
// 3999 0336 2591    155115
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFiles 'proguard-rules.pro'
            signingConfig signingConfigs.release
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17) // Ensure Java 17 compatibility
    }


    dexOptions {
        preDexLibraries = false
        javaMaxHeapSize "4g"
    }
    packagingOptions {
        // Strip files that are never loaded at runtime. Safe: removes only
        // bundled source dumps (android-query-full ships .java), license text,
        // and build metadata. No classes/resources/features are touched.
        resources {
            excludes += [
                    'META-INF/LICENSE.txt',
                    'META-INF/*.kotlin_module',
                    'META-INF/**/LICENSE.txt',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.md',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/DEPENDENCIES',
                    'META-INF/*.version',
                    'LICENSE-junit.txt',
                    '**/*.java',
                    '**/*.kt'
            ]
        }
    }
    buildFeatures{
        buildConfig=true
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }


}

