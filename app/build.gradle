def loadSigningProps = {
    def props = new Properties()
    def candidates = [
            rootProject.file("keystore.properties"),
            rootProject.file("local.properties"),
            file("${projectDir}/keystore.properties")
    ]
    candidates.each { f ->
        if (f.exists()) {
            f.withInputStream { props.load(it) }
        }
    }
    return props
}
def signingProps = loadSigningProps()

android {
    signingConfigs {
        release {
            def releaseKeystore = file("${projectDir}/../anyNews.jks")
            if (!releaseKeystore.exists()) {
                releaseKeystore = file('R:\\work\\AndroidStudioProjects\\anynews\\gitLab\\AnyNews\\anyNews.jks')
            }
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                // Prefer keystore.properties / local.properties; fallback keeps local assembleRelease working.
                storePassword signingProps['storePassword'] ?: signingProps['KEYSTORE_STORE_PASSWORD'] ?: 'sagiam123'
                keyAlias signingProps['keyAlias'] ?: signingProps['KEYSTORE_KEY_ALIAS'] ?: 'anyNews'
                keyPassword signingProps['keyPassword'] ?: signingProps['KEYSTORE_KEY_PASSWORD'] ?: '123sagiam'
            } else {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    namespace "com.anyNews.anynews"
    compileSdk 35

